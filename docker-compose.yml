version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: mplads-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mplads_sentinel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: mplads-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mplads_sentinel
      ML_SERVICE_URL: http://ml-service:8000
    ports:
      - '4000:4000'
    depends_on:
      - postgres
      - ml-service

  ml-service:
    build:
      context: ./ml-service
    container_name: mplads-ml
    restart: unless-stopped
    environment:
      PYTHON_ENV: development
      PORT: 8000
    ports:
      - '8000:8000'

volumes:
  postgres_data:
